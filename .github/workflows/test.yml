name: Testing

on: [pull_request]

jobs:
  pdfme-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install
      - run: npm run build
      # Explicit dist verification — this is a defence-in-depth check on top
      # of the per-package `postbuild` hook, so that even if a future change
      # accidentally drops `postbuild` from one package, CI still catches a
      # partial / shape-broken dist before publish.
      - run: npm run verify-dist
      - run: npm run lint
      - run: npm run test
        env:
          CI: true

  playground-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies and build project
        run: |
          npm install
          npm run build
      - name: Run playground tests
        run: |
          cd playground
          npm install
          npm run lint
          npm run build
          npm run test
        env:
          CI: true
